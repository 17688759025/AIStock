name: Auction score rescue

on:
  schedule:
    - cron: '32,42,52 1 * * 1-5' # 09:32, 09:42, 09:52 Shanghai
    - cron: '12 2 * * 1-5' # 10:12 final publication check
  workflow_run:
    workflows: ['Auction snapshot collector']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-score-rescue-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rescue:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Score a saved capture when the first run missed publication
        run: |
          set -euo pipefail
          DATE="$(date +%F)"
          CAPTURE="data/auction/${DATE}.capture.json"
          RESULT="data/auction/${DATE}.result.json"
          if [ -f "$CAPTURE" ] && [ ! -f "$RESULT" ]; then
            node scripts/collect_auction_result.cjs --score-only
            bash scripts/publish-auction-data.sh result
          elif [ -f "$RESULT" ]; then
            echo "Verified result file present: $RESULT"
          else
            echo "::error::No saved 09:25 capture or result for $DATE; cannot substitute intraday quotes (also check exchange holidays)."
            exit 1
          fi
