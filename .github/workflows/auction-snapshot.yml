name: Auction snapshot collector

on:
  schedule:
    # Start early; the process waits for 09:25:03 Asia/Shanghai.
    # GitHub cron is best effort. A run arriving after 09:30 must fail closed.
    - cron: '5,15 1 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Collect debug data only; never publish it as a 09:25 result'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auction-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify freeze and trading-window invariants
        run: node --test tests/auction-window.test.cjs
      - name: Freeze the 09:25 result
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            node scripts/collect_auction_result.cjs --debug
          else
            node scripts/collect_auction_result.cjs
          fi
      - name: Commit immutable dated result
        if: ${{ inputs.debug != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p data/auction
          git add data/auction
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze 09:25 auction result $(date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug == true }}
        with:
          name: auction-result-debug
          path: /tmp/auction-result-debug.json
