name: Auction snapshot collector

on:
  schedule:
    # GitHub cron can arrive hours late. The 20:45 UTC run corresponds to
    # 04:45 Asia/Shanghai on the following Mon-Fri and waits for 09:25:03.
    - cron: '45 20 * * 0-4'
    - cron: '45 0 * * 1-5'
    - cron: '5,15 1 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Collect debug data only; never publish it as a 09:25 result'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auction-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify freeze and trading-window invariants
        run: node --test tests/auction-window.test.cjs tests/auction-capture.test.cjs
      - name: Capture verified auction quotes before optional scoring
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            node scripts/collect_auction_result.cjs --debug
          else
            node scripts/collect_auction_result.cjs --capture-only
          fi
      - name: Persist raw auction capture first
        if: ${{ inputs.debug != true }}
        run: bash scripts/publish-auction-data.sh capture
      - name: Score only from saved auction capture
        if: ${{ inputs.debug != true }}
        run: node scripts/collect_auction_result.cjs --score-only
      - name: Commit immutable dated result
        if: ${{ inputs.debug != true }}
        run: bash scripts/publish-auction-data.sh result
      - name: Preserve capture and diagnostics even when collection or publishing fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auction-capture-and-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/auction/*.capture.json
            data/auction/*.result.json
            /tmp/auction-collector-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug == true }}
        with:
          name: auction-result-debug
          path: /tmp/auction-result-debug.json
