name: Auction snapshot collector

on:
  schedule:
    # 09:15 Asia/Shanghai, Monday-Friday. The collector waits for exact slots.
    - cron: '15 1 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Collect one current debug snapshot instead of waiting for auction slots'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auction-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect snapshots
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/collect_auction_snapshot.py --debug
          else
            python scripts/collect_auction_snapshot.py
          fi
      - name: Commit shared snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/auction
          git diff --cached --quiet || git commit -m "Update auction snapshot $(date -u +%F)"
          git push
