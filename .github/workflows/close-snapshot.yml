name: Close snapshot collector

on:
  schedule:
    # 14:10 / 14:20 Shanghai: start early and wait for 14:30.
    - cron: '10,20 6 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Test current data without publishing a formal 14:30 result'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: close-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen snapshots and time windows
        run: node --test tests/*.test.cjs
      - name: Capture and freeze 14:30 inputs
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            node scripts/collect_close_result.cjs --debug
          else
            node scripts/collect_close_result.cjs
          fi
      - name: Publish immutable dated result
        if: ${{ inputs.debug != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p data/close
          git add data/close
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze 14:30 close result $(date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug == true }}
        with:
          name: close-result-debug
          path: /tmp/close-result-debug.json
