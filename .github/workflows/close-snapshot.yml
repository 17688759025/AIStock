name: Close snapshot collector

on:
  schedule:
    # Early independent runners wait until 14:30:03. Later attempts provide
    # redundancy, but schedule delivery is not guaranteed by GitHub.
    - cron: '27,57 4 * * 1-5' # 12:27, 12:57 Shanghai
    - cron: '27,57 5 * * 1-5' # 13:27, 13:57 Shanghai
    - cron: '20,25,30 6 * * 1-5' # 14:20, 14:25, 14:30 Asia/Shanghai
  workflow_dispatch:
    inputs:
      debug:
        description: 'Test current data without publishing a formal 14:30 result'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Dated close files are write-once. Parallel attempts are intentional: the
  # first runner that reaches Eastmoney during 14:30 wins.
  group: close-snapshot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Covers the earliest 12:27 start plus capture, scoring and publication.
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen snapshots and time windows
        run: node --test tests/*.test.cjs
      - name: Capture and freeze 14:30 inputs
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            node scripts/collect_close_result.cjs --debug
          else
            node scripts/collect_close_result.cjs --capture-only
          fi
      - name: Publish immutable 14:30 capture
        if: ${{ inputs.debug != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p data/close
          target="data/close/$(TZ=Asia/Shanghai date +%F).capture.json"
          git add -- "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture 14:30 close inputs $(date +%F)"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin main
              if git cat-file -e "origin/main:$target" 2>/dev/null; then
                git reset --mixed origin/main >/dev/null
                git restore --source=origin/main --worktree -- "$target"
                echo "$target already published by another attempt"
                exit 0
              fi
              exit 1
            fi
            if git push origin main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Score from saved 14:30 capture
        if: ${{ inputs.debug != true }}
        run: node scripts/collect_close_result.cjs --score-only
      - name: Publish immutable dated result
        if: ${{ inputs.debug != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          target="data/close/$(TZ=Asia/Shanghai date +%F).result.json"
          git add -- "$target" data/close/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze 14:30 close result $(date +%F)"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              git fetch origin main
              if git cat-file -e "origin/main:$target" 2>/dev/null; then exit 0; fi
              exit 1
            fi
            if git push origin main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Preserve raw capture and result even if publication fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: close-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/close/*.capture.json
            data/close/*.result.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug == true }}
        with:
          name: close-result-debug
          path: /tmp/close-result-debug.json
