name: Monthly sector evidence collector
on:
  schedule:
    # 07:40, 12:40, 17:40, 22:40 Shanghai, including international weekends.
    - cron: '40 4,9,14,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly-sector-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_monthly_sectors.py'
      - id: capture
        run: python scripts/collect_monthly_sectors.py
      - name: Publish dated evidence
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: |
          if [ ! -d data/monthly ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/monthly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update monthly sector evidence $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
