name: Premarket candidate collector

on:
  schedule:
    # Start early for GitHub scheduler latency; script waits until 08:50 Asia/Shanghai.
    - cron: '35 0 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Collect current test data without waiting or publishing formal dated data'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: premarket-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect premarket candidates at 08:50 Asia/Shanghai
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/collect_premarket_candidates.py --debug --output /tmp/premarket-debug.json
          else
            python scripts/collect_premarket_candidates.py
          fi
      - name: Commit shared candidates
        if: ${{ inputs.debug != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/premarket
          git diff --cached --quiet || git commit -m "Update premarket candidates $(date -u +%F)"
          git push
