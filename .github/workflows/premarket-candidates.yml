name: Premarket candidate collector

on:
  schedule:
    # 04:35 Shanghai Mon-Fri; the runner waits until 08:50.
    - cron: '35 20 * * 0-4'
    - cron: '35 22 * * 0-4'
    - cron: '35 0 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Collect current test data without waiting or publishing formal dated data'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: premarket-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify premarket dates and deadline
        run: python -m unittest discover -s tests -p 'test_premarket.py'
      - name: Collect premarket candidates at 08:50 Asia/Shanghai
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/collect_premarket_candidates.py --debug --output /tmp/premarket-debug.json
          else
            python scripts/collect_premarket_candidates.py
          fi
      - name: Commit shared candidates
        if: ${{ inputs.debug != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/premarket
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update premarket candidates $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
